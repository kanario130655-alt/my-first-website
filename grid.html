<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex practice </title>
  <style>
    body{
      min-height: 800px;
      border: 8px solid black;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      align-content: center;
      
    }
    div{
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100px;
      height: 100px;
      font-weight: 700;
      padding: 1em;
    }
  </style>
</head>
<body>
  <div style="background-color: lightblue;">div1</div>
  <div style="background-color: lightpink;">div2</div>
  <div style="background-color: rgb(148, 8, 146);">div3</div>
  <div style="background-color: lightblue;">div4</div>
  <div style="background-color: lightpink;">div5</div>
  <div style="background-color: rgb(148, 8, 146);">div6</div>
  <div style="background-color: lightblue;">div7</div>
  <div style="background-color: lightpink;">div8</div>
  <div style="background-color: rgb(148, 8, 146);">div9</div>
</body>
</html>
